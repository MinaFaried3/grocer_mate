name: grocer_mate
description: A grocery storefront with an offline checkout outbox.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.3.1
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  get_it: ^9.2.1
  go_router: ^18.1.4
  dio: ^5.9.2
  hive_ce: ^2.24.0
  json_annotation: ^4.12.0
  material_ui: ^1.11.0
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/mock_api/
    - assets/photos/
